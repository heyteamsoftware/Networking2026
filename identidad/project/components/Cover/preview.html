<!-- @dsCard height=288 -->
<div class="cover">
  <svg class="art" viewBox="0 0 960 288" aria-hidden="true">
    <!--
      blocks: slab = tinta (480×288, bleeds top/right; noche in Arena, arena in Noche) + the 7 tangram pieces in mesa-1…mesa-4 at 232 px, radio-0
      arrangement: one tall slab with the tangram as satellites, the four mesas pulled slightly apart (the despiece)
      pattern: four 45° rules in tinta-suave, the tangram's own cutting angle; chosen because the README says every cut is 0°, 45° or 90°
      scales: junta 2.5 % of the side; offsets esp-2 (16) between mesas; slab inset esp-6 (48) from the name zone; radio-0 everywhere
    -->
    <rect class="slab" x="480" y="0" width="480" height="288"/>
    <line class="rule" x1="520" y1="288" x2="808" y2="0"/>
    <line class="rule" x1="600" y1="288" x2="888" y2="0"/>
    <line class="rule" x1="680" y1="288" x2="960" y2="8"/>
    <line class="rule" x1="760" y1="288" x2="960" y2="88"/>
    <g transform="translate(604 28) scale(0.58)">
      <g transform="translate(0 -28)"><polygon class="m1" points="12.07,5 387.93,5 200,192.93"/></g>
      <g transform="translate(-28 0)"><polygon class="m2" points="5,12.07 192.93,200 5,387.93"/></g>
      <g transform="translate(26 -10)">
        <polygon class="m3" points="395,12.07 395,187.93 307.07,100"/>
        <polygon class="m3" points="207.07,200 300,107.07 392.93,200 300,292.93"/>
        <polygon class="m3" points="200,207.07 287.93,295 112.07,295"/>
      </g>
      <g transform="translate(0 28)">
        <polygon class="m4" points="12.07,395 102.07,305 287.93,305 197.93,395"/>
        <polygon class="m4" points="395,212.07 395,395 212.07,395"/>
      </g>
    </g>
  </svg>
  <div class="name">
    <h1>Networking 2026</h1>
    <p>Del aula a la realidad. Un tangram de cuatro mesas.</p>
  </div>
</div>
<style>
  html, body { margin: 0; background: var(--fondo); }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--fondo); }
  .art { position: absolute; inset: 0; width: 960px; height: 288px; }
  .slab { fill: var(--tinta); }
  .rule { stroke: var(--tinta-suave); stroke-width: 1.5; }
  .m1 { fill: var(--mesa-1); } .m2 { fill: var(--mesa-2); } .m3 { fill: var(--mesa-3); } .m4 { fill: var(--mesa-4); }
  .name { position: absolute; left: 40px; bottom: 36px; max-width: 400px; }
  .name h1 { margin: 0 0 12px; font-family: var(--font-display); font-weight: 400; font-size: 72px; line-height: .95; color: var(--tinta); width: 6em; }
  .name p { margin: 0; font-family: var(--font-texto); font-size: 14px; line-height: 1.4; color: var(--tinta-suave); }
</style>
